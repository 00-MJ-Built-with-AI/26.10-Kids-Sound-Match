  <style>.sun { animation: spin 12s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .sweat { animation: sweat 2s ease-in infinite; }
    @keyframes sweat { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(26px); opacity: 0 } }undefined.rumble { animation: rumble .35s ease-in-out infinite alternate; }
    @keyframes rumble { from { transform: translateX(-2px) } to { transform: translateX(2px) } }
    .float { animation: float 2.4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
