<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>.breathe { animation: breathe 1s ease-in-out infinite; transform-box: view-box; transform-origin: 200px 380px; }
    @keyframes breathe { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(1.025) } }.sun { animation: spin 12s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .sweat { animation: sweat 2s ease-in infinite; }
    @keyframes sweat { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(26px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
