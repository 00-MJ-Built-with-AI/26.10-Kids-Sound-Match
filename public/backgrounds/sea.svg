<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .drift { animation: drift 60s linear infinite; }
  .drift.b { animation-duration: 90s; animation-direction: reverse; }
  @keyframes drift { from { transform: translateX(-80px) } 50% { transform: translateX(80px) } to { transform: translateX(-80px) } }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .twinkle.b { animation-delay: 1.5s; }
  @keyframes twinkle { 0%,100% { opacity: .9 } 50% { opacity: .3 } }
  .sway { animation: sway 5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { from { transform: rotate(-2deg) } to { transform: rotate(2deg) } }
  .bob { animation: bob 4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }
  </style>
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDF4FF"/><stop offset="1" stop-color="#BFE6FF"/></linearGradient></defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  
    <path d="M0 160 Q200 130 400 160 T800 160 T1200 160 T1600 160 V0 H0 Z" fill="#E9F8FF"/>
    <circle class="bob" cx="120" cy="300" r="8" fill="#fff" opacity="0.6"/><circle class="bob" cx="250" cy="397" r="14" fill="#fff" opacity="0.6"/><circle class="bob" cx="380" cy="494" r="20" fill="#fff" opacity="0.6"/><circle class="bob" cx="510" cy="591" r="8" fill="#fff" opacity="0.6"/><circle class="bob" cx="640" cy="688" r="14" fill="#fff" opacity="0.6"/><circle class="bob" cx="770" cy="385" r="20" fill="#fff" opacity="0.6"/><circle class="bob" cx="900" cy="482" r="8" fill="#fff" opacity="0.6"/><circle class="bob" cx="1030" cy="579" r="14" fill="#fff" opacity="0.6"/><circle class="bob" cx="1160" cy="676" r="20" fill="#fff" opacity="0.6"/><circle class="bob" cx="1290" cy="373" r="8" fill="#fff" opacity="0.6"/><circle class="bob" cx="1420" cy="470" r="14" fill="#fff" opacity="0.6"/><circle class="bob" cx="1550" cy="567" r="20" fill="#fff" opacity="0.6"/>
    <path d="M0 880 Q400 840 800 880 T1600 870 V1000 H0 Z" fill="#F6E3B8"/>
