<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>.bub { animation: bub 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bub.b { animation-delay: .8s; } .bub.c { animation-delay: 1.6s; }
    @keyframes bub { 0%,100% { transform: scale(.85) translateY(0) } 50% { transform: scale(1.1) translateY(-6px) } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><clipPath id="tile"><rect x="4" y="4" width="392" height="392" rx="60"/></clipPath></defs>
  <g transform="scale(1.28)"><g clip-path="url(#tile)"><rect x="4" y="4" width="392" height="392" rx="60" fill="#E2F4FB"/><g transform="rotate(-12 200 220)"><rect x="150" y="100" width="100" height="210" rx="34" fill="#fff" stroke="#4A2C12" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="150" y="180" width="100" height="130" rx="30" fill="#FFF6E8"/><rect x="150" y="100" width="100" height="210" rx="34" fill="none" stroke="#4A2C12" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M168 160 h22 M168 200 h22 M168 240 h22" fill="none" stroke="#9AA8C0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="160" y="76" width="80" height="30" rx="10" fill="#F05A8C" stroke="#4A2C12" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M182 76 Q184 30 200 30 Q216 30 218 76 Z" fill="#F7D046" stroke="#4A2C12" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/></g><g class="bub"><circle cx="300" cy="120" r="10" fill="#fff" stroke="#4A2C12" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><g class="bub b"><circle cx="320" cy="170" r="7" fill="#fff" stroke="#4A2C12" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g></g></g>
</svg>
