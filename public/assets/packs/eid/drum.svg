    @keyframes note { 0% { transform: translateY(8px); opacity: 0 } 30% { opacity: 1 } 100% { transform: translate(10px,-40px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
