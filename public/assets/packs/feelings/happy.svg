  <style>.sway { animation: sway 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }.bounce { animation: bounce 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 200px 390px; }
    @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-12px) } }.twinkle { animation: twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.b { animation-delay: .8s; }
    @keyframes twinkle { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(.5); opacity: .4 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
