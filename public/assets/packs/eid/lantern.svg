<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>.swing { animation: swing 2.6s ease-in-out infinite; transform-origin: 200px 20px; }
    @keyframes swing { 0%,100% { transform: rotate(-5deg) } 50% { transform: rotate(5deg) } }
    .glow { animation: glow 1.4s ease-in-out infinite alternate; }
    @keyframes glow { from { opacity: .75 } to { opacity: 1 } }.shine { animation: shine 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .shine.b { animation-delay: 1.1s; }
    @keyframes shine { 0%,100% { transform: scale(.4); opacity: 0 } 50% { transform: scale(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
